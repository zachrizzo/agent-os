<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent OS · map dev</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #map { position: fixed; inset: 0; }
      #bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--bg-1); border: 1px solid var(--line-2); z-index: 10; }
      #bar button { padding: 6px 14px; border-radius: 7px; color: var(--fg-2); }
      #bar button.on { background: var(--bg-3); color: var(--fg); }
      #info { position: fixed; right: 14px; top: 12px; color: var(--muted); z-index: 10; text-align: right; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="bar"><button data-z="fleet">Fleet</button><button data-z="team">Team</button><button data-z="agent">Agent</button></div>
    <div id="info"></div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
