<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent OS voice control · mock Control UI host</title>
<style>
  /* Control UI 2026.9.7 palette (dist/control-ui core stylesheet): dark :root, light under [data-theme-mode=light]. The real host flips data-theme-mode on <html>. */
  :root { --bg:#0e1015; --bg-elevated:#191c24; --card:#161920; --text:#bcbcc0; --text-strong:#f4f4f5; --muted:#8b8b94; --border:#1e2028; --accent:#ff5c5c; --accent-foreground:#0e1015; --accent-2:#14b8a6; --ok:#22c55e; --warn:#f59e0b; --danger:#f87171; --destructive:#ef4444; --info:#60a5fa; --font-body:"Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; color-scheme: dark; }
  :root[data-theme-mode="light"] { --bg:#faf9f7; --bg-elevated:#fff; --card:#fff; --text:#403c35; --text-strong:#211e1a; --muted:#6e6960; --border:#e8e4dc; --accent:#bd4531; --accent-foreground:#fff; --accent-2:#0d9488; --ok:#166534; --warn:#92400e; --danger:#b91c1c; --destructive:#dc2626; --info:#1d4ed8; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 var(--font-body); display:grid; grid-template-columns:200px 1fr; grid-template-rows:auto 1fr; height:100vh; }
  #banner { grid-column:1/3; padding:4px 12px; background:color-mix(in srgb, var(--warn) 18%, var(--bg)); color:var(--text-strong); font-size:11px; display:flex; gap:12px; align-items:center; }
  #banner span { flex:1; }
  #theme-toggle { padding:2px 10px; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
  nav { border-right:1px solid var(--border); padding:10px; display:flex; flex-direction:column; gap:4px; }
  nav button { text-align:left; padding:6px 8px; background:none; border:0; border-radius:6px; color:var(--text); font:inherit; cursor:pointer; }
  nav button[aria-current="page"] { background:var(--bg-elevated); }
  nav h4 { margin:10px 0 2px; font-size:10px; text-transform:uppercase; color:var(--muted); }
  #view { min-width:0; min-height:0; display:flex; flex-direction:column; }
  #view > .page { flex:1; min-height:0; }
  .chat { display:flex; flex-direction:column; height:100%; }
  .chat header { display:flex; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--border); }
  .chat header .title { font-weight:600; margin-right:auto; }
  .chat header button { padding:4px 10px; border:1px solid var(--border); border-radius:6px; background:none; color:var(--text); font:inherit; cursor:pointer; }
  .chat .transcript { flex:1; padding:12px; color:var(--muted); }
  .chat footer { border-top:1px solid var(--border); padding:10px 12px; }
  .agent-chat__input--chat { display:flex; gap:8px; align-items:center; }
  .agent-chat__input--chat textarea { flex:1; min-width:0; resize:none; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--text); font:inherit; }
  .agent-chat__composer-actions { display:flex; gap:6px; align-items:center; position:relative; }
  .chat-talk-control { display:inline-flex; align-items:center; gap:6px; }
  .chat-send-btn { min-width:34px; height:34px; border-radius:17px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text); cursor:pointer; font:inherit; }
  .chat-send-btn--voice-live { background:var(--accent); border-color:var(--accent); color:var(--accent-foreground); }
  .live-note { color:var(--ok); font-size:12px; }
  .picker { position:absolute; bottom:40px; right:0; width:240px; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--card); font-size:12px; }
  /* From the Control UI 2026.9.7 stylesheet: base hides the mobile variants; narrow width swaps them in and hides the Talk button. */
  .chat-mobile-dictation-action,.chat-mobile-talk-action,.chat-mobile-primary-action{display:none}
  .chat-desktop-primary-action{display:contents}
  @media (width<=560px){
    .agent-chat__input--chat .agent-chat__composer-actions>.chat-talk-control:not(.chat-talk-control--active){display:none}
    .agent-chat__input--chat :is(.chat-mobile-dictation-action,.chat-mobile-primary-action){display:inline-flex}
    .agent-chat__input--chat .chat-desktop-primary-action:not(.chat-mobile-primary-action){display:none}
  }
</style>
</head>
<body>
<div id="banner"><span>MOCK Control UI host (dev harness). The Agent OS tab code below is the real built plugin; the Voice chat pane reproduces the Control UI 2026.9.7 composer (tap/hold mic, dictation-only twin, talk.catalog gating, draft-sends-on-tap). No audio, no Gateway Talk.</span><button id="theme-toggle" type="button">Theme: dark</button></div>
<nav id="nav"></nav>
<main id="view"></main>
<script type="module">
const params = new URLSearchParams(location.search);
// Mock of the Control UI theme switch: it sets data-theme-mode on <html> (and wa-light/wa-dark); the plugin's theme bridge watches that.
const setMode = (m) => { const el = document.documentElement; el.dataset.themeMode = m; el.dataset.themeResolved = m; el.classList.toggle("wa-light", m === "light"); el.classList.toggle("wa-dark", m === "dark"); document.getElementById("theme-toggle").textContent = "Theme: " + m; };
setMode(params.get("theme") === "light" ? "light" : "dark");
document.getElementById("theme-toggle").onclick = () => setMode(document.documentElement.dataset.themeMode === "light" ? "dark" : "light");
const manifest = await (await fetch("/openclaw.plugin.json")).json();
const css = document.createElement("link");
css.rel = "stylesheet";
css.href = "/" + manifest.controlUi.styles[0];
document.head.append(css);
const plugin = (await import("/" + manifest.controlUi.entry)).default;

const view = document.getElementById("view");
const navEl = document.getElementById("nav");
const hostAbort = new AbortController();
const pages = new Map();
const navItems = [];
const actions = [];
let selectedKey = "agent:main:main";
let current = null; // { dispose }
let talkLive = false;
const stats = window.__stats = { talkStarts: 0, dictationStarts: 0, sends: 0, pickerOpens: 0, activeAtTalk: null };
const log = (...a) => console.log("[harness]", ...a);

function unmount() {
  if (!current) return;
  if (current.kind === "chat" && talkLive) { talkLive = false; log("Voice pane unmounted -> Talk ended (mirrors Control UI)"); }
  current.dispose?.();
  current = null;
}
function renderNav(active) {
  navEl.replaceChildren();
  const add = (label, on, id) => { const b = document.createElement("button"); b.textContent = label; if (id === active) b.setAttribute("aria-current", "page"); b.onclick = on; navEl.append(b); };
  add("Chat · main", () => host.sessions.open({ sessionKey: "agent:main:main" }), "agent:main:main");
  const h = document.createElement("h4"); h.textContent = "Pinned"; navEl.append(h);
  add("Voice", () => host.sessions.open({ sessionKey: "agent:voice:main" }), "agent:voice:main");
  const h2 = document.createElement("h4"); h2.textContent = "Plugins"; navEl.append(h2);
  for (const n of navItems) add(n.label, () => host.navigation.openPage(n.page), "page:" + n.page.id);
}
function mountPage(id) {
  unmount();
  const page = pages.get(id);
  const ctl = new AbortController();
  const c = document.createElement("div");
  c.className = "page";
  view.replaceChildren(c);
  const ret = page.mount(c, { host, signal: ctl.signal, props: {}, presented: true, mountDefault: () => () => {} });
  current = { kind: "page", dispose: () => { ctl.abort(); ret?.dispose?.(); c.remove(); } };
  renderNav("page:" + id);
}
function showChat(sessionKey) {
  unmount();
  const root = document.createElement("section");
  root.className = "chat";
  const header = document.createElement("header");
  const title = document.createElement("span");
  title.className = "title";
  title.textContent = sessionKey === "agent:voice:main" ? "Voice" : "Chat · main";
  title.title = sessionKey; // lets harness checks see which session the plugin opened
  header.append(title);
  for (const a of actions) {
    const r = a.resolve?.({ sessionKey }) ?? {};
    if (r.hidden) continue;
    const b = document.createElement("button");
    b.textContent = r.label ?? a.label;
    b.onclick = () => a.run({ sessionKey, host, signal: hostAbort.signal });
    header.append(b);
  }
  const transcript = document.createElement("div");
  transcript.className = "transcript";
  transcript.textContent = sessionKey === "agent:voice:main" ? "Voice session — Talk starts from the mic below." : "Main chat.";
  const footer = document.createElement("footer");
  const composer = document.createElement("div");
  composer.className = "agent-chat__input agent-chat__input--chat";
  const textarea = document.createElement("textarea");
  textarea.rows = 1;
  textarea.placeholder = "Message…";
  textarea.value = params.get("draft") ?? "";
  const composerActions = document.createElement("div");
  composerActions.className = "agent-chat__composer-actions";
  composer.append(textarea, composerActions);
  footer.append(composer);
  // Mirrors the real composer: talk.catalog is requested at mount; until it answers ready a tap only opens the mic picker.
  let status = "checking";
  window.__catalogDoneAt = performance.now() + Number(params.get("catalogMs") ?? 700);
  setTimeout(() => { status = params.get("status") === "unavailable" ? "unavailable" : "ready"; drawMic(); }, Number(params.get("catalogMs") ?? 700));
  let pickerOpen = false;
  const drawMic = () => {
    composerActions.replaceChildren();
    if (params.has("nomic")) return;
    if (talkLive) {
      const live = document.createElement("span");
      live.className = "chat-talk-control chat-talk-control--active";
      live.innerHTML = '<button class="chat-send-btn chat-send-btn--voice-live" aria-label="Stop voice input">■</button> <span class="live-note">Listening…</span>';
      live.querySelector("button").onclick = () => { talkLive = false; log("Talk stopped"); drawMic(); };
      composerActions.append(live);
      return;
    }
    const tap = () => {
      if (textarea.value.trim()) { stats.sends++; textarea.value = ""; log("SEND (tap with draft)"); return; }
      if (status !== "ready") { pickerOpen = true; stats.pickerOpens++; log("picker opened (status " + status + ")"); drawMic(); return; }
      stats.talkStarts++;
      stats.activeAtTalk = navigator.userActivation?.isActive ?? null;
      setTimeout(() => { talkLive = true; log("Talk started"); drawMic(); }, 500);
    };
    // Real handler: pointerdown arms a hold timer (-> dictation); a plain click with no preceding pointerdown is the tap path.
    let holdTimer = null, held = false, suppressClick = false;
    const talk = document.createElement("span");
    talk.className = "chat-talk-control";
    talk.innerHTML = '<button class="chat-send-btn chat-send-btn--voice chat-send-btn--hold-enabled" type="button" aria-label="Start voice input">🎙 Talk</button>';
    const tb = talk.querySelector("button");
    tb.addEventListener("pointerdown", () => { held = false; suppressClick = true; holdTimer = setTimeout(() => { held = true; stats.dictationStarts++; log("DICTATION started (hold)"); }, 400); });
    tb.addEventListener("pointerup", () => { clearTimeout(holdTimer); if (!held) { suppressClick = false; tap(); suppressClick = true; } setTimeout(() => { suppressClick = false; }, 0); });
    tb.addEventListener("click", (e) => { if (suppressClick) { e.preventDefault(); return; } tap(); });
    const dict = document.createElement("span");
    dict.className = "chat-mobile-dictation-action";
    dict.innerHTML = '<span class="chat-talk-control"><button class="chat-send-btn chat-send-btn--voice" type="button" aria-label="Dictation">Dictate</button></span>';
    dict.querySelector("button").onclick = () => { stats.dictationStarts++; log("DICTATION started (direct)"); };
    const primary = document.createElement("span");
    primary.className = "chat-mobile-primary-action chat-desktop-primary-action";
    primary.innerHTML = '<button class="chat-send-btn chat-send-btn--send" type="button" aria-label="Send" disabled>↑</button>';
    composerActions.append(talk, dict, primary);
    if (pickerOpen) {
      const p = document.createElement("div");
      p.className = "picker";
      p.innerHTML = '<div data-chat-talk-capability="realtime" data-status="' + status + '">Realtime voice: ' + status + '</div>';
      composerActions.append(p);
    }
  };
  // Composer mounts a beat after the pane, like the real one.
  setTimeout(() => { if (current?.root === root) drawMic(); }, 300);
  root.append(header, transcript, footer);
  view.replaceChildren(root);
  current = { kind: "chat", root, dispose: () => root.remove() };
  renderNav(sessionKey);
}

const host = {
  apiVersion: 1, pluginId: "agent-os", signal: hostAbort.signal, basePath: "", locale: "en", redact: (t) => t,
  connection: { connected: true, canRead: true, canWrite: true, canGrant: false, canAdmin: true, assistantAgentId: "main" },
  components: {},
  request: async (method) => {
    if (method === "plugins.sessionAction") return { ok: true, result: { up: true, url: "/agent-os/" } };
    if (method === "talk.catalog") {
      // Same Gateway connection as the composer's own mount-time request, so ours answers after it (unless ?fastCatalog).
      const wait = params.has("fastCatalog") ? 0 : Math.max(0, (window.__catalogDoneAt ?? 0) - performance.now()) + 20;
      await new Promise((r) => setTimeout(r, wait));
      return { realtime: { ready: params.get("status") !== "unavailable" }, transcription: { ready: false } };
    }
    return {};
  },
  onEvent: () => () => {},
  subscribe: () => () => {},
  sessions: {
    rows: [],
    get selectedKey() { return selectedKey; },
    normalizeKey: (k) => k,
    refresh: async () => {},
    observe: () => ({ refresh: async () => {}, dispose() {} }),
    open: ({ sessionKey }) => { setTimeout(() => { selectedKey = sessionKey; showChat(sessionKey); }, 60); },
    create: async () => null,
    patch: async () => {},
  },
  agents: { rows: [], selectedId: null, defaultId: null, scopeId: null, select() {}, setScope() {}, refresh: async () => {} },
  navigation: { openPage: (t) => mountPage(t.id), pageHref: () => "#" },
  ui: {
    invalidate() {},
    registerPage: (p) => { pages.set(p.id, p); return () => {}; },
    registerNavigation: (n) => { navItems.push(n); return () => {}; },
    registerPanel: () => () => {},
    registerAction: (a) => { actions.push(a); return () => {}; },
    registerAccessory: () => () => {},
    registerWidget: () => () => {},
    registerReplacement: () => () => {},
    selectReplacement() {},
  },
};
await plugin.activate(host);
if (params.get("start") === "voice") host.sessions.open({ sessionKey: "agent:voice:main" });
else host.navigation.openPage({ id: "agent-os" });
</script>
</body>
</html>
